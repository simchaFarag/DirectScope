# Add inside the site's `server { ... }` block (CloudPanel → Sites → the site → Vhost), above the first `location`.
# Routes /api and /uploads to the Node server; everything else keeps serving the built React app.
# `^~` matters: CloudPanel's vhost has a regex location for static files (.png, .jpg…) that would otherwise
# catch uploaded images and look for them in htdocs.

client_max_body_size 100m;

location ^~ /api/ {
  proxy_pass http://127.0.0.1:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location ^~ /uploads/ {
  proxy_pass http://127.0.0.1:4000;
  proxy_set_header Host $host;
  expires 30d;
}

# Security headers for the web app itself (the API already sends its own through helmet). The site's HTML had no CSP and
# no HSTS; the login token lives in localStorage, so the CSP is the second line of defence against injected scripts.
# Keep these at the `server { ... }` level. Note: a `location` that has its own add_header doesn't inherit them.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
